music_directory     "~/Music"
playlist_directory  "~/Music/Playlists"
db_file             "~/.config/mpd/database"
state_file          "~/.config/mpd/state"
log_file            "~/.config/mpd/log"
auto_update         "yes"
bind_to_address     "127.0.0.1"
port                "6600"

audio_output {
    type    "pipewire"
    name    "PipeWire"
}

audio_output {
    type    "fifo"
    name    "rmpc_fifo"
    path    "/tmp/mpd.fifo"
    format  "44100:16:2"
}
